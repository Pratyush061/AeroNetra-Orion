[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeronetra-orion"
version = "0.1.0"
description = "AeroNetra-Orion — event-driven predictive perception for UAVs: neuromorphic event + frame fusion, a learned world model, and predictive collision avoidance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pratyush Jain" }]
keywords = [
  "computer-vision", "event-camera", "neuromorphic", "uav", "drone",
  "world-model", "predictive-perception", "collision-avoidance", "edge-ai",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
learn = ["torch>=2.2"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.5", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/Pratyush061/AeroNetra-Orion"
Source = "https://github.com/Pratyush061/AeroNetra-Orion"

[project.scripts]
orion = "orion.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
